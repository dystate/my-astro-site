name: Build Blue Journal IPA

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release label shown in the artifact name
        required: false
        default: dev
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: log-studio
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_SUPABASE_BUCKET: log-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: log-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile configuration
        shell: bash
        run: |
          test -n "$PUBLIC_SUPABASE_URL" || { echo "Missing repository variable SUPABASE_URL"; exit 1; }
          test -n "$PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing repository variable SUPABASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Build and sync Capacitor
        run: npm run mobile:sync

      - name: Generate app icon
        run: npm run mobile:icon

      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$IOS_CERTIFICATE_P12_BASE64" && -n "$IOS_PROVISION_PROFILE_BASE64" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install signing certificate and profile
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build signed archive
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BlueJournal.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.dystate.bluejournal</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BlueJournal.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/signed-export"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/signed-export"/*.ipa "artifacts/BlueJournal-signed.ipa"

      - name: Build unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p artifacts/Payload
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app" artifacts/Payload/BlueJournal.app
          cd artifacts
          zip -qry BlueJournal-unsigned.ipa Payload
          rm -rf Payload

      - name: Write build manifest
        shell: bash
        run: |
          cat > artifacts/build-info.txt <<EOF
          App: 蓝笺 / Blue Journal
          Bundle ID: com.dystate.bluejournal
          Commit: $GITHUB_SHA
          Signed: ${{ steps.signing.outputs.signed }}
          Content sync: Supabase log_entries
          Built: $(date -u +%FT%TZ)
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueJournal-iOS-${{ github.event.inputs.release_name || github.ref_name }}
          path: |
            log-studio/artifacts/*.ipa
            log-studio/artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --title "蓝笺 iOS ${GITHUB_REF_NAME#ios-}" \
              --generate-notes
          fi
